<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nachtragsmanagement</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <strong>Nachtragsmanagement</strong>
      <span id="kopf-vorhaben" class="muted"></span>
    </div>
    <nav id="tabs">
      <button data-view="uebersicht" class="active">Übersicht</button>
      <button data-view="fristen">Fristen</button>
      <button data-view="liste">Nachtragsliste</button>
      <button data-view="uebergabe">Übergabe GL</button>
      <button data-view="einstellungen">Projekt &amp; Daten</button>
    </nav>
  </header>

  <div id="hinweis-lokal" class="banner">
    Daten liegen nur in diesem Browser. Maßgeblich ist die Nachtragsliste (Excel). Import und Export unter „Projekt &amp; Daten“.
  </div>

  <main>
    <section id="view-uebersicht" class="view"></section>
    <section id="view-fristen" class="view" hidden></section>
    <section id="view-liste" class="view" hidden></section>
    <section id="view-uebergabe" class="view" hidden></section>
    <section id="view-einstellungen" class="view" hidden></section>
  </main>

  <dialog id="editor">
    <form id="editor-form" method="dialog">
      <header class="dlg-head">
        <h2 id="editor-titel">Nachtrag</h2>
        <label class="toggle"><input type="checkbox" id="zeige-intern"> Interne Felder zeigen</label>
      </header>
      <div id="editor-kennzahlen" class="kennzahlen"></div>
      <div id="editor-luecken"></div>
      <div id="editor-felder"></div>
      <footer class="dlg-foot">
        <button type="button" id="editor-loeschen" class="danger">Löschen</button>
        <span class="spacer"></span>
        <button type="button" id="editor-abbrechen">Abbrechen</button>
        <button type="submit" id="editor-speichern" class="primary">Speichern</button>
      </footer>
    </form>
  </dialog>

  <script src="model.js"></script>
  <script src="app.js"></script>
</body>
</html>
